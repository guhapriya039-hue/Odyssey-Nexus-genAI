# Fly.io deployment. The Dockerfile is used as-is; this file only declares the
# volume, the health check and the public port.
#
#   fly launch --no-deploy        # first time, to create the app
#   fly volumes create odyssey_data --size 1 --region sin
#   fly deploy
#   fly open                      # prints the public URL

app = "odyssey-transform-core"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  PORT = "8000"
  LLM_ENABLED = "false"
  EMBEDDING_PROVIDER = "auto"
  GROUNDING_MIN_SCORE = "0.55"
  NUMERIC_GROUNDING = "true"
  PII_REDACTION = "true"
  # Keep false in any shared deployment: this is the SSRF guard.
  ALLOW_PRIVATE_NETWORK_FETCH = "false"
  ALLOW_WEB_INGESTION = "true"

# SQLite, uploads and the audit ledger live here. Run `fly volumes create
# odyssey_data` before the first deploy or this mount will not exist.
[[mounts]]
  source = "odyssey_data"
  destination = "/srv/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

# The image already sets HOST=0.0.0.0 and the DATABASE_URL/UPLOAD_DIR paths.
