[project]
name = "odyssey-transform-core"
version = "1.4.0"
description = "Source-grounded Gen AI platform for automated content transformation (SIH26154)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "pillow>=10.3",
]

[project.optional-dependencies]
# Multimodal extras. The platform degrades gracefully when these are absent.
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17"]
speech = ["faster-whisper>=1.0"]
office = ["python-pptx>=0.6.23"]
embeddings = ["sentence-transformers>=3.0", "numpy>=1.26"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "E501"]
