# ODYSSEY TRANSFORM CORE - Render blueprint (free web service).
#
# Render builds the repo Dockerfile, so the deployed service is the same single
# image docker compose runs: FastAPI serving the built dashboard on one port.
#
# Apply at https://dashboard.render.com/blueprint/new
#
# Two free-tier facts shape the environment below:
#   * No persistent disk on Free, and the Free filesystem is ephemeral, so the
#     SQLite ledger and uploaded originals live under /tmp. They are lost on
#     every deploy, restart and idle spin-down. That is acceptable for a demo
#     and is the one thing not to rely on.
#   * 512 MB RAM / 0.1 CPU, so the upload ceiling is dropped to 10 MB. Uploads
#     are read fully into memory before the size check, and PDF/OCR work is
#     held in RAM too; 40 MB is a request the free instance cannot survive.

services:
  - type: web
    name: odyssey-transform-core
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Render injects PORT; 10000 is its convention for a single web service.
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: production

      # Ephemeral storage. See the note above. The ledger sits directly in /tmp
      # because SQLite will not create a missing parent directory for it.
      - key: DATABASE_URL
        value: sqlite:////tmp/odyssey.db
      - key: UPLOAD_DIR
        value: /tmp/odyssey/uploads

      # No LLM: the deterministic extractive engine is the default and needs
      # no network, no key and no model download.
      - key: LLM_ENABLED
        value: "false"
      - key: EMBEDDING_PROVIDER
        value: auto

      # Guardrails stay exactly as shipped.
      - key: RETRIEVAL_TOP_K
        value: "6"
      - key: GROUNDING_MIN_SCORE
        value: "0.55"
      - key: NUMERIC_GROUNDING
        value: "true"
      - key: PII_REDACTION
        value: "true"
      - key: ALLOW_PRIVATE_NETWORK_FETCH
        value: "false"
      - key: ALLOW_WEB_INGESTION
        value: "true"
      - key: RETENTION_DAYS
        value: "90"
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
