# One-click deploy to Render: https://render.com/deploy
#
# The whole product is one Docker image: the dashboard is built in stage 1 and
# served by FastAPI in stage 2, so there is a single origin and no CORS to
# configure. The disk is required, not optional: SQLite, the upload directory
# and the audit ledger all live on it, and without it every redeploy would
# reset the platform to an empty state.

services:
  - type: web
    name: odyssey-transform-core
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      # Deterministic extractive engine by default: no API key, no network.
      - key: LLM_ENABLED
        value: "false"
      - key: EMBEDDING_PROVIDER
        value: auto
      - key: RETRIEVAL_TOP_K
        value: "6"
      - key: GROUNDING_MIN_SCORE
        value: "0.55"
      - key: NUMERIC_GROUNDING
        value: "true"
      - key: PII_REDACTION
        value: "true"
      # Keep false in any shared deployment: this is the SSRF guard that stops
      # URL ingestion from reaching loopback, link-local and private ranges.
      - key: ALLOW_PRIVATE_NETWORK_FETCH
        value: "false"
      - key: ALLOW_WEB_INGESTION
        value: "true"
      - key: MAX_UPLOAD_BYTES
        value: "41943040"
      - key: RETENTION_DAYS
        value: "90"
      # Uncomment to use an OpenAI-compatible endpoint instead of extraction.
      # - key: LLM_BASE_URL
      #   value: https://api.openai.com/v1
      # - key: LLM_MODEL
      #   value: gpt-4o-mini
      # - key: LLM_API_KEY
      #   sync: false
    disk:
      name: odyssey-data
      mountPath: /srv/app/data
      sizeGB: 1
